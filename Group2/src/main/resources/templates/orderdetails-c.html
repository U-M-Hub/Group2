<!DOCTYPE html>
	<html lang="ja"
		  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>注文履歴</title>
</head>
<body>

	<h1 th:text = "${message}">メッセージ</h1>

	<!-- 注文履歴一覧表示 -->
	<table th:if = "${DetailsByUserId}" border = '1'>
		<thread>
			<tr>
				<th>注文日</th>
				<th colspan="2">注文番号</th>
				<th>タイトル</th>
				<th>価格</th>
				<th>数量</th>
			</tr>
		</thread>
		<tbody>
			<tr th:each = "orders : ${DetailsByUserId}">
				<td th:text = "${orders.orderDate}">注文日</td>
				<td th:text = "${orders.orderNumber}">注文番号</td>
				<td th:text = "${orders.orderBranchNumber}">枝番</td>
				<td th:text = "${orders.bookTitle}">タイトル</td>
				<td th:text = "${orders.orderPrice}">価格</td>
				<td th:text = "${orders.bookCount}">数量</td>
			</tr>
		</tbody>		
	</table>

	<br>
<!--	<a th:href = "@{/}">書籍一覧に戻る</a>	-->
	<a>書籍一覧に戻る</a>	
	
</body>
</html>
