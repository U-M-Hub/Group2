	<!-- Controllerから受け取ったエラーメッセージを表示 -->

		<button type="button" id="backButton">
			戻る
		</button>
<!--		</form>-->
	
		<script>
			document.getElementById("backButton").addEventListener("click", function(){
				
				const lastEditUrl = sessionStorage.getItem("lastEditUrl");
				
				if(lastEditUrl){
					//保存された編集画面へ戻る
					window.location.href = lastEditUrl;
				}else{
					//保存情報がなければ書籍一覧へ戻る
					window.location.href = "/adminBookList/1";
				}
				
			});
			
		</script>
