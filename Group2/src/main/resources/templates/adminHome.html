<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>【管理者】ホーム画面</title>
    <link rel="stylesheet" th:href="@{/css/adminHome.css}">
</head>
<body>

<div th:replace="~{fragments/adminLayout :: layout}"></div>

<div class="admin-container">

    <h2 class="page-title">🏡管理者ホーム画面🏡</h2>

    <!-- 管理情報 -->
    <section class="admin-info">

        <h3 class="section-title">管理情報</h3>

        <!-- 在庫切れの書籍がある場合のみ表示 -->
        <p class="stock-alert" th:if="${outOfStockCount > 0}">
            ⚠ 在庫切れの書籍があります
            （<span th:text="${outOfStockCount}">0</span>件）
        </p>

        <div class="info-grid">

            <div class="info-card">
                <p>登録書籍数</p>
                <strong>
                    <span th:text="${bookCount}">0</span>
                    <small>冊</small>
                </strong>
            </div>

            <div class="info-card">
                <p>公開書籍数</p>
                <strong>
                    <span th:text="${publishedBookCount}">0</span>
                    <small>冊</small>
                </strong>
            </div>

            <div class="info-card">
                <p>非公開書籍数</p>
                <strong>
                    <span th:text="${unpublishedBookCount}">0</span>
                    <small>冊</small>
                </strong>
            </div>

            <div class="info-card">
                <p>注文件数</p>
                <strong>
                    <span th:text="${orderCount}">0</span>
                    <small>件</small>
                </strong>
            </div>

        </div>

    </section>

    <!-- 管理メニュー -->
    <main class="admin-menu-section">

        <h3 class="section-title">管理メニュー</h3>

        <p class="menu-description">
            利用する管理機能を選択してください。
        </p>

        <div class="menu">

            <!-- 書籍一覧画面 -->
            <a th:href="@{/adminBookList/1}" class="menu-card">
                <span class="menu-icon">📚</span>
                <span class="menu-text">書籍一覧</span>
                <span class="menu-arrow">›</span>
            </a>

            <!-- 書籍新規登録 -->
            <a th:href="@{/admin/books/adminAddBook}" class="menu-card">
                <span class="menu-icon">📖</span>
                <span class="menu-text">書籍新規登録</span>
                <span class="menu-arrow">›</span>
            </a>

            <!-- 注文履歴 -->
            <a th:href="@{/admin/orders}" class="menu-card">
                <span class="menu-icon">📋</span>
                <span class="menu-text">注文履歴</span>
                <span class="menu-arrow">›</span>
            </a>

        </div>

    </main>

</div>

</body>
</html>
