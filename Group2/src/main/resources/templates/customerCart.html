<!DOCTYPE html>
<html lang="ja"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>カート画面</title>

	<!-- table th, table td の部分								-->
	<!--   テーブルの見出し（th）と								-->
	<!--   データ部分（td）の内側に余白を設ける設定				-->
	<!-- padding: 8px 12px：上下の余白(8px)と左右の余白(12px)	-->
	<style>
		table th,
		table td {
		    padding: 8px 12px;
		}
	</style>
	
</head>
<body>

	<h1>注文一覧</h1>

	<thead>
	    <tr>
	        <th>タイトル</th>
	        <th>注文数</th>
	    </tr>
	</thead>
	
	
	
	
</body>
</html>
