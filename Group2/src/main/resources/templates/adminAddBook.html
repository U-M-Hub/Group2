<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>書籍登録画面</title>
<link rel="stylesheet" th:href="@{/css/adminHome.css}">
<link rel="stylesheet" th:href="@{/css/adminAddBook.css}">
</head>
<body>
	
	<div th:replace="~{fragments/adminLayout :: layout}"></div>
	
	<h2>■♰新規登録♰</h2>
	
	<!-- 登録成功時にメッセージを表示する -->
	<p th:if="${param.success}" style="color:blue;">
		書籍を登録しました！
	</p>
	
	<!-- 書籍登録用フォーム -->
	<form id="bookForm"
		  th:action="@{/admin/books/adminAddBook}"
		  th:object="${BookForm}"
		  method="post">
	  

		  <!-- 書籍名 -->
		  <div>
		      <div class="form-label-row">
		          <label for="book_title">書籍名</label>
		          <span class="required">必須</span>
		          <span class="error-message"
		                th:errors="*{book_title}"></span>
		      </div>

		      <input type="text"
		             id="book_title"
		             th:field="*{book_title}">
		  </div>

		  <!-- 著者名 -->
		  <div>
		      <div class="form-label-row">
		          <label for="book_author">著者名</label>
		          <span class="required">必須</span>
		          <span class="error-message"
		                th:errors="*{book_author}"></span>
		      </div>

		      <input type="text"
		             id="book_author"
		             th:field="*{book_author}">
		  </div>

		  <!-- 価格 -->
		  <div>
		      <div class="form-label-row">
		          <label for="book_price">価格</label>
		          <span class="required">必須</span>
		          <span class="error-message"
		                th:errors="*{book_price}"></span>
		      </div>

		      <input type="number"
		             id="book_price"
		             th:field="*{book_price}">
		  </div>

		  <!-- あらすじ -->
		  <div>
		      <div class="form-label-row">
		          <label for="book_summary">あらすじ</label>
		          <span class="optional">任意</span>
		          <span class="error-message"
		                th:errors="*{book_summary}"></span>
		      </div>

		      <textarea id="book_summary"
		                th:field="*{book_summary}"
		                rows="5"
		                cols="40"></textarea>
		  </div>

		  <!-- 表紙画像 -->
		  <div>
		      <div class="form-label-row">
		          <label for="book_cover">表紙画像</label>
		          <span class="optional">任意</span>
		          <span class="error-message"
		                th:errors="*{book_cover}"></span>
		      </div>

		      <select id="book_cover"
		              th:field="*{book_cover}">

		          <option value="">画像を選択してください</option>

		          <option th:each="image : ${images}"
		                  th:value="${image}"
		                  th:text="${image}">
		          </option>
		      </select>

		      <!-- 選択した画像のプレビュー -->
		      <img id="bookCoverPreview"
		           src=""
		           alt="表紙画像プレビュー"
		           style="display:none; width:120px; margin-top:10px;">
		  </div>

		  <!-- ジャンル -->
		  <div>
		      <div class="form-label-row">
		          <label for="book_genre">ジャンル</label>
		          <span class="required">必須</span>
		          <span class="error-message"
		                th:errors="*{book_genre}"></span>
		      </div>

		      <select id="book_genre"
		              th:field="*{book_genre}">

		          <option value="">選択してください</option>

		          <option th:each="genre : ${genres}"
		                  th:value="${genre.genre_id}"
		                  th:text="${genre.genre_name}">
		          </option>
		      </select>
		  </div>

		  <!-- 在庫数 -->
		  <div>
		      <div class="form-label-row">
		          <label for="book_stock">在庫数</label>
		          <span class="required">必須</span>
		          <span class="error-message"
		                th:errors="*{book_stock}"></span>
		      </div>

		      <input type="number"
		             id="book_stock"
		             th:field="*{book_stock}">
		  </div>

		  <!-- 出版社 -->
		  <div>
		      <div class="form-label-row">
		          <label for="book_publisher">出版社</label>
		          <span class="required">必須</span>
		          <span class="error-message"
		                th:errors="*{book_publisher}"></span>
		      </div>

		      <input type="text"
		             id="book_publisher"
		             th:field="*{book_publisher}">
		  </div>

		  <!-- 公開状態 -->
		  <div>
		      <div class="form-label-row">
		          <label for="book_flag">公開状態</label>
		      </div>

		      <select id="book_flag"
		              th:field="*{book_flag}">

		          <option th:value="false">OFF（非公開）</option>
		          <option th:value="true">ON（公開）</option>
		      </select>
		  </div>
		  
		  <!-- 入力した書籍情報を送信する -->
		  <button type="submit">登録する</button>
		  
		  <br>
		  <br>
		  <a th:href="@{/admin/home}">＜＜商品管理者ホーム画面へ戻る</a>
		  
		  
	  </form>
	  
	  <script>
		//表紙画像の選択欄を取得する
		const bookCoverSelect = document.getElementById("book_cover");
		//プレビュー用の画像要素を取得する
		const bookCoverPreview = document.getElementById("bookCoverPreview");
		
		//選択された画像をプレビューに反映する
		function updateBookCoverPreview(){
			const filename = bookCoverSelect.value;
			if(filename){
				//static/images内の画像を表示する
				bookCoverPreview.src = 
				"/images/" + encodeURIComponent(filename);
				bookCoverPreview.style.display = "block";
			}else{
				//画像が未選択ならプレビューを隠す
				bookCoverPreview.style.display = "none";
				bookCoverPreview.removeAttribute("src");
			}
		}
		//画像を選択したときにプレビューを更新する
		bookCoverSelect.addEventListener("change", updateBookCoverPreview);
		//初期表示時にもプレビューを更新する
		updateBookCoverPreview();
		
		//フォーム内容が入力されたかどうか
		let formChanged = false;
		
		const form = document.getElementById("bookForm");
		//フォームの内容が変更されたら記録
		form.addEventListener("input", function(){
			formChanged = true;
		});
		//プルダウンの変更も記録
		form.addEventListener("change", function(){
			formChanged = true;
		});		
		//画面を離れるときの警告
		window.addEventListener("beforeunload", function(event){
			if(formChanged){
				event.preventDefault();
			}
		});
		//登録ボタンを押して送信する場合は警告を出さない
		form.addEventListener("submit", function(){
			formChanged = false;
		});
	  </script>

</body>
</html>
